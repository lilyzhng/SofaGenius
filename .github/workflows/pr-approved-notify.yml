name: PR Approval Notification

on:
  pull_request_review:
    types: [submitted]

jobs:
  notify:
    if: github.event.review.state == 'approved' && github.event.review.user.login == 'lilyzhng'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send Discord notification
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          FEATURE_RELEASE_CHANNEL: "1484388088087052478"
          GH_TOKEN: ${{ github.token }}
        run: |
          AUTHOR="${{ github.event.pull_request.user.login }}"
          PR_NUM="${{ github.event.pull_request.number }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          PR_TITLE="${{ github.event.pull_request.title }}"

          # Map GitHub username to Discord bot ID
          # Uses Jackie's bot token to post — Jackie is the notifier since she doesn't raise PRs here
          DISCORD_ID=$(jq -r ".\"${AUTHOR}\"" agents/github-to-discord.json)

          if [ "$DISCORD_ID" != "null" ] && [ -n "$DISCORD_ID" ]; then
            MENTION="<@${DISCORD_ID}>"
          else
            MENTION=""
          fi

          # Look for the discord-announcement comment to find the right thread
          ANNOUNCEMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${PR_NUM}/comments" \
            --jq '.[] | select(.body | startswith("discord-announcement:")) | .body | ltrimstr("discord-announcement: ") | rtrimstr("\n")' \
            2>/dev/null | head -1)

          # Build the notification message
          MESSAGE="${MENTION} PR #${PR_NUM} approved by Lily — merge it!\n**${PR_TITLE}**\n${PR_URL}"

          if [ -n "$ANNOUNCEMENT_ID" ]; then
            # Try posting in the existing thread (message ID = thread ID for threads on messages)
            RESPONSE=$(curl -s -w "\n%{http_code}" -H "Content-Type: application/json" \
              -H "Authorization: Bot ${DISCORD_BOT_TOKEN}" \
              -d "$(jq -n --arg msg "$MESSAGE" '{content: $msg}')" \
              "https://discord.com/api/v10/channels/${ANNOUNCEMENT_ID}/messages")

            HTTP_CODE=$(echo "$RESPONSE" | tail -1)

            if [ "$HTTP_CODE" != "200" ]; then
              # Thread doesn't exist yet — create one on the announcement message
              curl -sf -H "Content-Type: application/json" \
                -H "Authorization: Bot ${DISCORD_BOT_TOKEN}" \
                -d "$(jq -n --arg msg "$MESSAGE" '{name: "PR Approved", auto_archive_duration: 1440, message: {content: $msg}}')" \
                "https://discord.com/api/v10/channels/${FEATURE_RELEASE_CHANNEL}/messages/${ANNOUNCEMENT_ID}/threads"
            fi
          else
            # Fallback: post in the channel if no announcement ID found
            curl -sf -H "Content-Type: application/json" \
              -H "Authorization: Bot ${DISCORD_BOT_TOKEN}" \
              -d "$(jq -n --arg msg "$MESSAGE" '{content: $msg}')" \
              "https://discord.com/api/v10/channels/${FEATURE_RELEASE_CHANNEL}/messages"
          fi
