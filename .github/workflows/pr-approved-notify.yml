name: PR Approval Notification

on:
  pull_request_review:
    types: [submitted]

jobs:
  notify:
    if: github.event.review.state == 'approved' && github.event.review.user.login == 'lilyzhng'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          AUTHOR="${{ github.event.pull_request.user.login }}"
          PR_NUM="${{ github.event.pull_request.number }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          PR_TITLE="${{ github.event.pull_request.title }}"

          # Map GitHub username to Discord bot ID
          DISCORD_ID=$(jq -r ".\"${AUTHOR}\"" agents/github-to-discord.json)

          if [ "$DISCORD_ID" != "null" ] && [ -n "$DISCORD_ID" ]; then
            MSG="<@${DISCORD_ID}> PR #${PR_NUM} approved by Lily — merge it!\n**${PR_TITLE}**\n${PR_URL}"
          else
            MSG="PR #${PR_NUM} approved by Lily — merge it!\n**${PR_TITLE}**\n${PR_URL}"
          fi

          curl -s -H "Content-Type: application/json" \
            -d "{\"content\": \"${MSG}\"}" \
            "${DISCORD_WEBHOOK_URL}"
