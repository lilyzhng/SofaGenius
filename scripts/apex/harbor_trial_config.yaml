# @package harbor_trial_config
#
# APEX Professional Tasks — Harbor + SkyRL config
# Adapted from SkyRL CodeContests example for professional analysis tasks

trials_dir: ~/apex-trials

timeout_multiplier: 1.0

agent:
  name: terminus-2
  override_timeout_sec: 600  # 10 min (APEX tasks are shorter than coding tasks)

  kwargs:
    max_turns: 16  # Professional tasks need fewer turns than code contests
    suppress_max_turns_warning: true
    enable_summarize: false
    store_all_messages: true
    temperature: 1.0

    model_info:
      max_input_tokens: 16384  # Smaller context — APEX tasks aren't as long
      max_output_tokens: 4096
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0

    llm_kwargs:
      timeout: 300
      max_retries: 0
      top_p: 1.0
      top_k: -1
      min_p: 0.0

environment:
  type: docker  # Local Docker first, switch to Modal later for scale
  override_cpus: 2
  override_memory_mb: 2048  # PDF processing needs more RAM
  override_storage_mb: 4096
  suppress_override_warnings: true

verifier:
  disable: false
