<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
  /* Web fonts (optional — falls back to Georgia/system sans-serif when offline) */
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #F9F8F6;
    color: #1A1918;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 960px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* Header */
  header {
    padding: 80px 0 48px;
    border-bottom: 1px solid #E8E6E3;
    margin-bottom: 64px;
  }

  .living-memory-label {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #CBA16E;
    margin-bottom: 24px;
  }

  .living-memory-label::before {
    content: '';
    width: 8px;
    height: 8px;
    background: #CBA16E;
    border-radius: 50%;
    display: inline-block;
  }

  header h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 42px;
    font-weight: 700;
    line-height: 1.2;
    margin-bottom: 16px;
    color: #1A1918;
  }

  .meta {
    font-size: 14px;
    color: #7A7874;
  }

  .meta span + span::before {
    content: '\00b7';
    margin: 0 10px;
  }

  /* Timeline Section */
  .section {
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 48px;
    margin-bottom: 56px;
    position: relative;
    min-height: 120px;
  }

  /* Timeline line */
  .section::before {
    content: '';
    position: absolute;
    left: 260px;
    top: 0;
    bottom: -56px;
    width: 2px;
    background: #E8E6E3;
  }

  .section:last-of-type::before {
    bottom: 0;
  }

  /* Timeline dot */
  .section::after {
    content: '';
    position: absolute;
    left: 254px;
    top: 6px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #F9F8F6;
    border: 2px solid #CBA16E;
    z-index: 1;
  }

  .section.pivot::after {
    background: #CBA16E;
    box-shadow: 0 0 0 4px rgba(203, 161, 110, 0.15);
  }

  /* Left column */
  .left-col {
    text-align: right;
    padding-right: 24px;
    padding-top: 0;
  }

  .round-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: #B0ACA7;
    margin-bottom: 16px;
  }

  .pivot-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #CBA16E;
    background: rgba(203, 161, 110, 0.1);
    border: 1px solid rgba(203, 161, 110, 0.3);
    padding: 3px 10px;
    border-radius: 3px;
    margin-bottom: 16px;
  }

  .quote-callout {
    position: relative;
    padding-top: 8px;
  }

  .quote-callout .quote-mark {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 64px;
    color: #CBA16E;
    line-height: 0.5;
    display: block;
    margin-bottom: 8px;
    opacity: 0.6;
  }

  .quote-callout p {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 15px;
    font-weight: 700;
    font-style: italic;
    line-height: 1.5;
    color: #3D3B38;
  }

  /* Right column */
  .right-col {
    padding-left: 32px;
  }

  .section-header {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 20px;
    color: #1A1918;
    line-height: 1.3;
  }

  /* Dialogue bubbles */
  .dialogue {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 16px;
  }

  .bubble {
    max-width: 85%;
    padding: 14px 18px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.55;
  }

  .bubble .speaker {
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 4px;
    display: block;
  }

  .bubble.user {
    align-self: flex-start;
    background: #FFFFFF;
    border: 1px solid #E8E6E3;
    border-bottom-left-radius: 4px;
  }

  .bubble.user .speaker { color: #CBA16E; }

  .bubble.other {
    align-self: flex-end;
    background: #2C2C2C;
    color: #E8E6E3;
    border-bottom-right-radius: 4px;
  }

  .bubble.other .speaker { color: #CBA16E; }

  /* Read original toggle */
  .toggle-btn {
    background: none;
    border: none;
    font-size: 13px;
    color: #B0ACA7;
    cursor: pointer;
    padding: 8px 0;
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: color 0.2s;
  }

  .toggle-btn:hover { color: #7A7874; }

  .toggle-btn .arrow {
    display: inline-block;
    transition: transform 0.2s;
    font-size: 10px;
  }

  .toggle-btn.open .arrow {
    transform: rotate(90deg);
  }

  .transcript {
    display: none;
    padding: 20px;
    margin-top: 8px;
    background: #F4F3F0;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.7;
    color: #4A4845;
    max-height: 400px;
    overflow-y: auto;
  }

  .transcript.open { display: block; }

  .transcript p { margin-bottom: 12px; }
  .transcript p:last-child { margin-bottom: 0; }
  .transcript strong { color: #1A1918; }

  /* Actionable Items */
  .actionables {
    border-top: 2px solid #CBA16E;
    margin-top: 48px;
    padding-top: 48px;
  }

  .actionables-header {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 32px;
    color: #1A1918;
  }

  .actionables-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 48px;
  }

  .actionables-col h3 {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #B0ACA7;
    margin-bottom: 16px;
  }

  .actionables-col.why p {
    font-size: 15px;
    line-height: 1.7;
    color: #3D3B38;
  }

  .actionables-col.items ul {
    list-style: none;
    padding: 0;
  }

  .actionables-col.items li {
    position: relative;
    padding-left: 20px;
    margin-bottom: 14px;
    font-size: 14px;
    line-height: 1.6;
    color: #3D3B38;
  }

  .actionables-col.items li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 8px;
    width: 8px;
    height: 8px;
    background: #CBA16E;
    border-radius: 50%;
  }

  /* Footer */
  footer {
    border-top: 1px solid #E8E6E3;
    padding: 32px 0 64px;
    margin-top: 32px;
    text-align: center;
    font-size: 12px;
    color: #B0ACA7;
    letter-spacing: 0.5px;
  }

  /* Mobile */
  @media (max-width: 768px) {
    header { padding: 48px 0 32px; }
    header h1 { font-size: 28px; }

    .section {
      display: block;
      padding-left: 28px;
      margin-bottom: 40px;
    }

    .section::before {
      left: 6px;
    }

    .section::after {
      left: 0;
      top: 4px;
    }

    .left-col {
      text-align: left;
      padding-right: 0;
      margin-bottom: 12px;
    }

    .quote-callout { display: none; }

    .right-col {
      padding-left: 0;
    }

    .section-header { font-size: 18px; }
    .bubble { max-width: 95%; }

    .actionables-grid {
      grid-template-columns: 1fr;
      gap: 24px;
    }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="living-memory-label">Living Memory</div>
    <h1>{{TITLE}}</h1>
    <div class="meta">
      <span>{{DATE}}</span>
      <span>{{PARTICIPANTS}}</span>
      <span>{{ROUND_COUNT}} rounds</span>
    </div>
  </header>

{{SECTIONS}}

{{ACTIONABLES}}

  <footer>
    WaveMind &middot; Captured {{CAPTURED_DATE}} &middot; Visualized {{VISUALIZED_DATE}}
  </footer>
</div>

<script>
function toggleTranscript(btn) {
  var transcript = btn.nextElementSibling;
  btn.classList.toggle('open');
  transcript.classList.toggle('open');
  var isOpen = transcript.classList.contains('open');
  var label = isOpen ? 'Hide original' : 'Read original';
  btn.innerHTML = '<span class="arrow" style="transform:' + (isOpen ? 'rotate(90deg)' : 'none') + '">&#9654;</span> ' + label;
}
</script>

</body>
</html>
