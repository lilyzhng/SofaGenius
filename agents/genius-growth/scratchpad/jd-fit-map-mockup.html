<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>JD Fit Map</title>
<style>body{margin:0;background:#0d1117;display:flex;justify-content:center;align-items:center;min-height:100vh;}</style>
</head><body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" font-family="'SF Mono', 'Fira Code', Consolas, monospace">
  <rect width="700" height="500" fill="#0d1117" rx="6"/>

  <text x="350" y="35" text-anchor="middle" fill="#484f58" font-size="10" letter-spacing="3">JD FIT MAP</text>
  <text x="350" y="58" text-anchor="middle" fill="#c9d1d9" font-size="13">Staff ML Engineer, Autonomous Vehicles</text>

  <!-- Circle 1: Technical Depth — largest -->
  <circle cx="245" cy="250" r="135" fill="#4ade80" fill-opacity="0.06" stroke="#4ade80" stroke-width="1" stroke-opacity="0.3"/>
  <text x="180" y="230" fill="#4ade80" font-size="30" font-weight="bold">92%</text>
  <text x="180" y="252" fill="#4ade80" font-size="9" opacity="0.7">TECHNICAL</text>

  <!-- Circle 2: Leadership — medium -->
  <circle cx="430" cy="240" r="115" fill="#4ade80" fill-opacity="0.06" stroke="#4ade80" stroke-width="1" stroke-opacity="0.3"/>
  <text x="450" y="220" fill="#4ade80" font-size="26" font-weight="bold">90%</text>
  <text x="450" y="240" fill="#4ade80" font-size="9" opacity="0.7">LEADERSHIP</text>

  <!-- Circle 3: Research — smaller -->
  <circle cx="340" cy="385" r="95" fill="#4ade80" fill-opacity="0.06" stroke="#4ade80" stroke-width="1" stroke-opacity="0.3"/>
  <text x="340" y="385" text-anchor="middle" fill="#4ade80" font-size="22" font-weight="bold">95%</text>
  <text x="340" y="405" text-anchor="middle" fill="#4ade80" font-size="9" opacity="0.7">RESEARCH</text>

  <!-- overall -->
  <text x="350" y="488" text-anchor="middle" fill="#4ade80" font-size="11">overall: 91%</text>
</svg>
</body></html>
